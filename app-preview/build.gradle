apply plugin: 'com.android.application'
apply plugin: 'com.mapbox.maps.token'
apply from: "${rootDir}/gradle/script-git-version.gradle"
apply from: "${rootDir}/gradle/ktlint.gradle"

android {
    namespace "com.mapbox.navigation.examples.preview"
    compileSdkVersion 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.mapbox.navigation.examples.preview"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode gitNumberOfCommits
        versionName gitTagDescription
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        vectorDrawables.useSupportLibrary = true
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildTypes {
        debug {
            testCoverageEnabled = false
            manifestPlaceholders = [enableCrashReporting: "false"]
        }
        release {
            minifyEnabled true
            manifestPlaceholders = [enableCrashReporting: "true"]
        }
    }

    lintOptions {
        abortOnError false
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            def srcDirs = file("$projectDir/src/main/java/com/mapbox/navigation/examples/preview")
                    .listFiles({ it.isDirectory() } as FileFilter)
                    .collect { it.name }

            res.srcDirs = ['src/main/res']
            srcDirs.forEach {
                res.srcDirs += 'src/main/java/com/mapbox/navigation/examples/preview/' + it + '/res'
            }
        }
    }
}

dependencies {
    // Mapbox Navigation SDK
    implementation "com.mapbox.navigationcore:copilot:3.33.0"
    implementation "com.mapbox.navigationcore:android:3.33.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.20"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "com.google.android.gms:play-services-location:21.4.0"
    implementation "com.squareup.leakcanary:leakcanary-android:2.14"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

}
