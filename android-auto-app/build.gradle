apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.mapbox.maps.token'
apply from: "${rootDir}/gradle/script-git-version.gradle"
apply from: "${rootDir}/gradle/ktlint.gradle"

android {
    namespace "com.mapbox.navigation.examples.androidauto"
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.mapbox.navigation.examples.androidauto"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode gitNumberOfCommits
        versionName gitTagDescription
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        vectorDrawables.useSupportLibrary = true
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildTypes {
        debug {
            testCoverageEnabled = false
            manifestPlaceholders = [enableCrashReporting: "false"]
        }
        release {
            minifyEnabled true
            manifestPlaceholders = [enableCrashReporting: "true"]
        }
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    lintOptions {
        abortOnError false
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.4.7'
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.5.1")
    implementation("com.google.android.material:material:1.7.0")

    // Mapbox Navigation Android Auto SDK Developer Preview
    implementation("com.mapbox.navigationcore:android-ndk27:3.30.1")
    implementation("com.mapbox.navigationcore:android-auto-components-ndk27:3.30.1")
    implementation("com.mapbox.navigationcore:ui-components-ndk27:3.30.1")
    implementation("com.mapbox.extension:maps-compose-ndk27:11.30.1")

    implementation("androidx.activity:activity-compose:1.9.2")
    implementation(platform('androidx.compose:compose-bom:2024.06.00'))
    implementation('androidx.compose.material3:material3')
    implementation('androidx.compose.ui:ui')
    implementation('androidx.compose.ui:ui-tooling-preview')
    debugImplementation('androidx.compose.ui:ui-tooling')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
}