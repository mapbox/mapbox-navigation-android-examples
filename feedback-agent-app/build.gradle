import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.mapbox.maps.token'
apply from: "${rootDir}/gradle/script-git-version.gradle"
apply from: "${rootDir}/gradle/ktlint.gradle"

android {
    namespace = "com.mapbox.navigation.examples.feedbackagent"
    compileSdkVersion 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.mapbox.navigation.examples.feedbackagent"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode gitNumberOfCommits
        versionName gitTagDescription
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        vectorDrawables.useSupportLibrary = true
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildTypes {
        debug {
            testCoverageEnabled = false
            manifestPlaceholders = [enableCrashReporting: "false"]
        }
        release {
            minifyEnabled true
            manifestPlaceholders = [enableCrashReporting: "true"]
        }
    }

    buildFeatures {
        compose true
    }

    lintOptions {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        optIn.addAll(
                "kotlin.RequiresOptIn",
                "kotlinx.coroutines.ExperimentalCoroutinesApi",
                "com.mapbox.navigation.base.ExperimentalPreviewMapboxNavigationAPI",
        )
    }
}

dependencies {
    implementation("com.mapbox.navigationcore:navigation:3.32.0")
    implementation("com.mapbox.navigationcore:core-mapgpt:3.32.0")
    implementation("com.mapbox.mapgpt.experimental:mapgpt:24.32.0")

    // Kotlin support
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.20"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
